#
# gfx950 subtile CompactLoopStore (CLS) -- on-hardware numerical coverage, beta == 0.
#
# This is the beta == 0 half of the gfx950 CLS hardware matrix. The beta != 0 half
# lives in cls_subtile_mt320x64_beta1_gfx950.yaml; DataInitTypeBeta/DataInitTypeC are
# GlobalParameters, so the two beta arms cannot share one file. Both files build the
# same kernels (UseBeta is on in the ProblemType either way) and differ only in the
# runtime beta/C data, so the pair covers the compiled beta branch both taken and not.
#
# Why this config exists: the gfx950 CLS store path (VGPR index mode, s_set_gpr_idx_on
# bracket, subtile SRD advance) is exercised numerically nowhere else. The in-tree CLS
# configs are all gfx1250 (v_movrelsd_2_b32, non-subtile, skip-gfx950) and the GPU-free
# structural suite builds only UseBeta=False kernels, so sgprBeta / SrdC / buffer_load
# never appear in anything it renders. A C-load SRD regression in readInput therefore
# validated green once already; it faults only at beta != 0.
#
# Axes covered here: beta == 0, edge and non-edge problem shapes, CompactLoopStore
# off vs on (the off arm makes a failure attributable to CLS), UseSubtileImpl forked
# on so the subtile store path is the one under test.
#
# Kernel class copied from the known-good gfx950 subtile recipe: F4BS MXFP4 ->
# BF16 TN with bias and activation, MIArchVgpr False (accvgpr reads, i.e. the
# index-mode bracket), StreamK 0 (required or computeCLSLayout cannot compact).
# MatrixInstruction [16,16,128,1, 1,10,2, 2,2] -> MT_M = 16*10*2 = 320,
# MT_N = 16*2*2 = 64, iterCount(outerTT1) = 2.
#
# Marks: cls_gfx950 selects the whole gfx950 CLS hardware set; cls_gfx950_smoke
# selects the cheap MT320x64 subset. See test_categories.yaml.
TestParameters:
  marks: [cls_gfx950, cls_gfx950_smoke, skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201, skip-gfx1250] # gfx950 index-mode CLS only

GlobalParameters:
  SyncsPerBenchmark: 0
  PrintSolutionRejectionReason: True
  NumElementsToValidate: -1
  MinimumRequiredVersion: 5.0.0
  PrintLevel: 3
  Device: 0
  CMakeBuildType: Release
  KernelTime: True
  MaxWorkspaceSize: 13421772800
  DataInitTypeA: 3
  DataInitTypeB: 3
  DataInitTypeC: 0
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 0
  DataInitTypeBias: 1
  DataInitTypeMXSA: 3
  DataInitTypeMXSB: 3
  MXScaleFormat: 1
  BoundsCheck: 0
  CpuThreads: 1
  RotatingBufferSize: 0

BenchmarkProblems:
  -
    - # ProblemType -- F4BS TN block-scaled MXFP4 -> BF16, bias + activation
      OperationType: GEMM
      DataType: F4
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      MXBlockA: 32
      MXBlockB: 32
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      Activation: True
      ActivationType: hipblaslt_all
      UseBias: 1
      BiasDataTypeList: [s]

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1,  1, 10, 2,  2, 2]   # MT320x64
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [0]
        - DepthU: [256]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - StreamK: [0]
        - StaggerU: [0]
        - UseSubtileImpl: [true]
        - MIArchVgpr: [False]
        - CompactLoopStore: [False, True]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          # non-edge: exactly one MT320x64 macro tile, K == DepthU
          - Exact: [320, 64, 1, 256]
          # edge: M and N are multiples of the MX block but not of the macro tile,
          # so both free dimensions leave a partial tile and the deferred edge
          # store batches execute.
          - Exact: [288, 96, 1, 256]
        - BiasTypeArgs: ['s']
        - ActivationArgs:
          - [Enum: none]
          - [Enum: relu]
