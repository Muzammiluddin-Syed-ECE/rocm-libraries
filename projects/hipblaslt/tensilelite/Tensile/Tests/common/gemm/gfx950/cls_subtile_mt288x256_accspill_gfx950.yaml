#
# gfx950 subtile CompactLoopStore (CLS) -- accumulator-spill gate, on hardware.
#
# Regression for a CLS numerical corruption whose whole cause is the tile's
# accumulator count. MIWaveTile [18,4] with OutputsPerMFMA 4 needs
# 18*4*4 = 288 MI output registers, 32 more than the 256-entry AGPR file, so
# mapAcctoArchRegs sources the top 32 from arch vgprs. The CLS loop steps its
# acc-read source index with M0, and M0 shifts a register index without changing
# the register FILE it names -- so a body compacted over that tile read accvgprs
# on the iterations whose values had spilled, and wrote garbage D.
# computeCLSLayout now refuses to compact a spilling layout
# (KernelWriterModules.clsAccSourcesSpill); this config is what proves it, and
# it FAILS on any build without the gate.
#
# The tile is the production solution from the original report (MT_M = 16*18*1 =
# 288, MT_N = 16*4*4 = 256). beta == 0 matches the reported failure; the CLS
# mechanism under test here is beta-independent, and
# cls_subtile_mt256x256_wrap_gfx950.yaml covers the beta != 0 arm.
#
# Kernel class is the known-good gfx950 subtile recipe: F4BS MXFP4 -> BF16 TN
# with bias and activation, MIArchVgpr False (accvgpr reads, i.e. the index-mode
# bracket -- and the only mode in which accumulators can spill at all),
# StreamK 0 and GlobalSplitU 1 (required or computeCLSLayout cannot compact).
# The CompactLoopStore False arm makes any failure attributable to CLS.
#
# Marks: cls_gfx950 selects the whole gfx950 CLS hardware set. See
# test_categories.yaml.
TestParameters:
  marks: [cls_gfx950, skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201, skip-gfx1250] # gfx950 index-mode CLS only

GlobalParameters:
  SyncsPerBenchmark: 0
  PrintSolutionRejectionReason: True
  NumElementsToValidate: -1
  MinimumRequiredVersion: 5.0.0
  PrintLevel: 3
  Device: 0
  CMakeBuildType: Release
  KernelTime: True
  MaxWorkspaceSize: 13421772800
  DataInitTypeA: 3
  DataInitTypeB: 3
  DataInitTypeC: 0
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 0
  DataInitTypeBias: 1
  DataInitTypeMXSA: 3
  DataInitTypeMXSB: 3
  MXScaleFormat: 1
  BoundsCheck: 0
  CpuThreads: 1
  RotatingBufferSize: 0

BenchmarkProblems:
  -
    - # ProblemType -- F4BS TN block-scaled MXFP4 -> BF16, bias + activation
      OperationType: GEMM
      DataType: F4
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      MXBlockA: 32
      MXBlockB: 32
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      Activation: True
      ActivationType: hipblaslt_all
      UseBias: 1
      BiasDataTypeList: [s]

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1,  1, 18, 4,  1, 4]   # MT288x256, 288 accumulators
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [1]
        - DepthU: [256]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - StreamK: [0]
        - GlobalSplitU: [1]
        - StaggerU: [0]
        - UseSubtileImpl: [true]
        - MIArchVgpr: [False]
        - NonTemporalD: [4]
        - WorkGroupMapping: [16]
        - WorkGroupMappingXCC: [1]
        - CompactLoopStore: [False, True]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          # non-edge: exactly one macro tile, then four of them. The corruption
          # is on the non-edge store path, which every aligned shape takes.
          - Exact: [288, 256, 1, 256]
          - Exact: [576, 512, 1, 256]
        - BiasTypeArgs: ['s']
        - ActivationArgs:
          - [Enum: none]
          - [Enum: relu]
