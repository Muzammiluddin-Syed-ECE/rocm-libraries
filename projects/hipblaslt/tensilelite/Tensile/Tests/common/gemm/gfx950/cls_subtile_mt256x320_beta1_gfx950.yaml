#
# gfx950 subtile CompactLoopStore (CLS) -- on-hardware numerical coverage, beta != 0,
# MT256x320 (the wide-N tile, 34 index-mode brackets and 6 SrdC advance sites).
#
# This is the single most load-bearing config in the gfx950 CLS hardware matrix. It is
# the exact (tile, beta) combination under which a reverted subtile readInput SRD advance
# takes an illegal address: MT320x64 passes at either beta with that defect present, and
# MT256x320 passes at beta == 0, so only MT256x320 at beta != 0 catches it. Deleting or
# weakening this file re-opens the gap that let the original C-load fault validate green.
#
# beta != 0 half; the beta == 0 half is cls_subtile_mt256x320_beta0_gfx950.yaml. Identical
# solution parameters and problem sizes, so both build the same kernel binaries and differ
# only in DataInitTypeC / DataInitTypeBeta. Keep the ForkParameters in sync.
#
# Axes covered here: beta != 0, edge and non-edge problem shapes, CompactLoopStore
# off vs on, UseSubtileImpl forked on.
#
# Kernel class, MatrixInstruction and tile geometry: see the beta == 0 twin.
#
# Marks: cls_gfx950 selects the whole gfx950 CLS hardware set. Deliberately not in
# the cls_gfx950_smoke subset -- this tile is the expensive one.
TestParameters:
  marks: [cls_gfx950, skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201, skip-gfx1250] # gfx950 index-mode CLS only

GlobalParameters:
  SyncsPerBenchmark: 0
  PrintSolutionRejectionReason: True
  NumElementsToValidate: -1
  MinimumRequiredVersion: 5.0.0
  PrintLevel: 3
  Device: 0
  CMakeBuildType: Release
  KernelTime: True
  MaxWorkspaceSize: 13421772800
  DataInitTypeA: 3
  DataInitTypeB: 3
  DataInitTypeC: 3
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 1
  DataInitTypeBias: 1
  DataInitTypeMXSA: 3
  DataInitTypeMXSB: 3
  MXScaleFormat: 1
  BoundsCheck: 0
  CpuThreads: 1
  RotatingBufferSize: 0

BenchmarkProblems:
  -
    - # ProblemType -- F4BS TN block-scaled MXFP4 -> BF16, bias + activation
      OperationType: GEMM
      DataType: F4
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      MXBlockA: 32
      MXBlockB: 32
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      Activation: True
      ActivationType: hipblaslt_all
      UseBias: 1
      BiasDataTypeList: [s]

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1,  1, 8, 10,  2, 2]   # MT256x320
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [0]
        - DepthU: [256]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - StreamK: [0]
        - StaggerU: [0]
        - UseSubtileImpl: [true]
        - MIArchVgpr: [False]
        - CompactLoopStore: [False, True]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          # non-edge: exactly one MT256x320 macro tile, K == DepthU
          - Exact: [256, 320, 1, 256]
          # edge: M and N are multiples of the MX block but not of the macro tile,
          # so both free dimensions leave a partial tile and the deferred edge
          # store batches execute.
          - Exact: [224, 288, 1, 256]
        - BiasTypeArgs: ['s']
        - ActivationArgs:
          - [Enum: none]
          - [Enum: relu]
