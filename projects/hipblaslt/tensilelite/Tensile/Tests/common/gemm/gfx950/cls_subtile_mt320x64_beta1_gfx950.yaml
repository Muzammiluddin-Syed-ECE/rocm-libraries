#
# gfx950 subtile CompactLoopStore (CLS) -- on-hardware numerical coverage, beta != 0.
#
# beta != 0 twin of cls_subtile_mt320x64_beta0_gfx950.yaml. Identical solution
# parameters and problem sizes, so both files build the same kernel binaries; only
# DataInitTypeC (0 -> Random) and DataInitTypeBeta (0 -> One) differ, which makes the
# compiled beta branch -- the C load through SrdC and the beta multiply-add -- actually
# execute. Keep the two files' ForkParameters in sync: the pair is only a beta A/B if
# the kernels are the same.
#
# This is the arm that matters most. The subtile CLS C-load SRD advance in readInput
# shipped broken once and validated green because the CLS configs of the day initialised
# beta to zero; at beta != 0 the same kernel takes an illegal address. Nothing on gfx950
# executed a CLS kernel at beta != 0 in any CI tier before this file.
#
# Axes covered here: beta != 0, edge and non-edge problem shapes, CompactLoopStore
# off vs on, UseSubtileImpl forked on.
#
# Kernel class, MatrixInstruction and tile geometry: see the beta == 0 twin.
#
# Marks: cls_gfx950 selects the whole gfx950 CLS hardware set; cls_gfx950_smoke
# selects the cheap MT320x64 subset. See test_categories.yaml.
TestParameters:
  marks: [cls_gfx950, cls_gfx950_smoke, skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201, skip-gfx1250] # gfx950 index-mode CLS only

GlobalParameters:
  SyncsPerBenchmark: 0
  PrintSolutionRejectionReason: True
  NumElementsToValidate: -1
  MinimumRequiredVersion: 5.0.0
  PrintLevel: 3
  Device: 0
  CMakeBuildType: Release
  KernelTime: True
  MaxWorkspaceSize: 13421772800
  DataInitTypeA: 3
  DataInitTypeB: 3
  DataInitTypeC: 3
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 1
  DataInitTypeBias: 1
  DataInitTypeMXSA: 3
  DataInitTypeMXSB: 3
  MXScaleFormat: 1
  BoundsCheck: 0
  CpuThreads: 1
  RotatingBufferSize: 0

BenchmarkProblems:
  -
    - # ProblemType -- F4BS TN block-scaled MXFP4 -> BF16, bias + activation
      OperationType: GEMM
      DataType: F4
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      MXBlockA: 32
      MXBlockB: 32
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      Activation: True
      ActivationType: hipblaslt_all
      UseBias: 1
      BiasDataTypeList: [s]

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1,  1, 10, 2,  2, 2]   # MT320x64
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [0]
        - DepthU: [256]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - StreamK: [0]
        - StaggerU: [0]
        - UseSubtileImpl: [true]
        - MIArchVgpr: [False]
        - CompactLoopStore: [False, True]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          # non-edge: exactly one MT320x64 macro tile, K == DepthU
          - Exact: [320, 64, 1, 256]
          # edge: M and N are multiples of the MX block but not of the macro tile,
          # so both free dimensions leave a partial tile and the deferred edge
          # store batches execute.
          - Exact: [288, 96, 1, 256]
        - BiasTypeArgs: ['s']
        - ActivationArgs:
          - [Enum: none]
          - [Enum: relu]
